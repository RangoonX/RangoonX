<!DOCTYPE html>
<html>

<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="This is static site">

  <!-- Unconditional, and not part of the splash block below: this tag used to
       arrive only because flutter_native_splash injected it. Without it a
       mobile browser lays the page out at a 980px viewport and scales it
       down, so the whole app renders tiny. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RangoonX">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>RangoonX</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Reload when WebKit restores the page from the back/forward cache instead
    // of resuming it. WebKit restores a Flutter app with its frame scheduling
    // broken: input and script keep running, but scheduled frames never
    // render, so the app silently freezes at its last painted state.
    //
    // In a packaged (Pyodide) app, Python state lives in the page and is lost
    // on reload - but WebKit's alternative is an app frozen at its last
    // painted frame, so a fresh start is still strictly better. Gated to
    // WebKit (every browser on iOS, Safari on macOS) because other engines
    // restore correctly and get to keep their state.
    window.addEventListener('pageshow', (event) => {
      if (event.persisted &&
        navigator.vendor && navigator.vendor.startsWith('Apple')) {
        window.location.reload();
      }
    });
  </script>

  <script>
    var flet = {
      pyodide: true,
      noCdn: false,
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "/",
      assetBase: "/",
      routeUrlStrategy: "path",
      // Only pinned when bundling. Left null, Flutter resolves CanvasKit from
      // gstatic and the Noto fallback fonts from Google Fonts, and the build
      // skips shipping local copies. A host serving its own runtime can assign
      // these without also claiming a no-CDN build.
      canvasKitBaseUrl: null,
      // .mjs is required: python-worker.js is a module worker and loads
      // the runtime via dynamic `import()`. Pyodide >= 0.29 also refuses
      // to run in classic workers. Use the local copy that `flet build`
      // drops into web/pyodide/ when --no-cdn is set; otherwise pull
      // from jsdelivr so the build artifact can stay slim.
      pyodideUrl: "https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.mjs",
      pythonModuleName: "main",
      webRenderer: "canvaskit",
      // "assets/fonts/" is the bundled Noto Emoji; null pulls it from Google Fonts.
      fontFallbackBaseUrl: null,
      appPackageUrl: "assets/app/app.zip"
    }

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });

    flet.flutterAppLoaded.then((flutterApp) => {
      console.log("Flutter app loaded");
    });
  </script>

  <!-- fletAppConfig -->

  <script src="python.js"></script>
  <script>
    function removeSplashFromWeb() {
      var s = document.getElementById("splash");
      if (s) { s.style.opacity = "0"; setTimeout(function() { s.remove(); }, 500); }
    }
    flet.flutterAppLoaded.then(function() { removeSplashFromWeb(); });
  </script>
</head>

<body>
  <div id="splash" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;transition:opacity .5s ease">
    <img src="assets/loading.png" alt="RangoonX" style="width:min(40vw,180px);height:auto;margin-bottom:28px;animation:pulse 2s infinite ease-in-out">
    <div style="width:min(50vw,160px);height:3px;background:#E5E7EB;border-radius:3px;overflow:hidden;position:relative">
      <div style="position:absolute;height:100%;background:#3B82F6;border-radius:3px;animation:loadingBar 1.5s infinite ease-in-out"></div>
    </div>
  </div>
  <style>
    @keyframes pulse{0%{transform:scale(.96);opacity:.85}50%{transform:scale(1.04);opacity:1}100%{transform:scale(.96);opacity:.85}}
    @keyframes loadingBar{0%{left:-50%;width:30%}50%{left:25%;width:50%}100%{left:100%;width:30%}}
  </style>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
