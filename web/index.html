<!DOCTYPE html><html><head>
  <base href="/RangoonX/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RangoonX Software House - Precision Engineering for the Digital Era.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RangoonX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>RangoonX | Software House</title>
  <link rel="manifest" href="manifest.json">

  <script>
    var flet = {
      pyodide: true,
      multiView: false,
      noCdn: "False".toLowerCase() == "true",
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "/RangoonX/",
      assetBase: "/RangoonX/",
      routeUrlStrategy: "path",
      canvasKitBaseUrl: "/canvaskit/",
      pyodideUrl: "https://cdn.jsdelivr.net/pyodide/v314.0.3/full/pyodide.mjs",
      pythonModuleName: "main",
      webRenderer: "canvaskit",
      fontFallbackBaseUrl: "assets/fonts/",
      appPackageUrl: "assets/app/app.zip"
    }

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });

    flet.flutterAppLoaded.then((flutterApp) => {
      console.log("Flutter app loaded");
      removeSplashFromWeb();
    });
  </script>
  <script src="python.js"></script>
  <style id="splash-screen-style">
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0B0F19;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      var splash = document.getElementById("splash");
      if (splash) {
        splash.style.opacity = "0";
        setTimeout(function() {
          splash.remove();
        }, 500);
      }
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>

<body>
  <div id="splash" style="position:fixed; top:0; left:0; width:100%; height:100%; background-color:#0B0F19; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:99999; transition: opacity 0.5s ease;">
    <img src="assets/images/rangoonX_logo.png" alt="RangoonX" style="width: 140px; height: auto; margin-bottom: 24px; animation: pulse 2s infinite ease-in-out;">
    <div style="width: 160px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; position: relative;">
      <div style="position: absolute; height: 100%; background: linear-gradient(90deg, #3B82F6, #60A5FA); border-radius: 4px; animation: loadingBar 1.5s infinite ease-in-out;"></div>
    </div>
    <p style="color: #94A3B8; font-size: 13px; margin-top: 16px; letter-spacing: 0.5px;">Loading RangoonX...</p>
  </div>
  <style>
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.85; }
      50% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(0.96); opacity: 0.85; }
    }
    @keyframes loadingBar {
      0% { left: -50%; width: 30%; }
      50% { left: 25%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
