name: Web Build + Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  UV_PYTHON: "3.12"
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build app
        shell: bash
        run: |
          uv run flet build web --yes --verbose --web-renderer auto --base-url /${GITHUB_REPOSITORY#*/}/ --route-url-strategy hash --no-web-splash

      - name: Apply custom splash screen
        shell: bash
        run: |
          cp src/assets/loading.png build/web/assets/loading.png

          python3 - <<'PYEOF'
          import pathlib
          idx = pathlib.Path("build/web/index.html")
          html = idx.read_text()

          splash_script = '''<script>
    function removeSplashFromWeb() {
      var s = document.getElementById("splash");
      if (s) { s.style.opacity = "0"; setTimeout(function() { s.remove(); }, 500); }
    }
    flet.flutterAppLoaded.then(function() { removeSplashFromWeb(); });
  </script>
</head>'''

          splash_body = '''<body>
  <div id="splash" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;transition:opacity .5s ease">
    <img src="assets/loading.png" alt="RangoonX" style="width:min(40vw,180px);height:auto;margin-bottom:28px;animation:pulse 2s infinite ease-in-out">
    <div style="width:min(50vw,160px);height:3px;background:#E5E7EB;border-radius:3px;overflow:hidden;position:relative">
      <div style="position:absolute;height:100%;background:#3B82F6;border-radius:3px;animation:loadingBar 1.5s infinite ease-in-out"></div>
    </div>
  </div>
  <style>
    @keyframes pulse{0%{transform:scale(.96);opacity:.85}50%{transform:scale(1.04);opacity:1}100%{transform:scale(.96);opacity:.85}}
    @keyframes loadingBar{0%{left:-50%;width:30%}50%{left:25%;width:50%}100%{left:100%;width:30%}}
  </style>'''

          html = html.replace("</head>", splash_script)
          html = html.replace("<body>", splash_body)
          idx.write_text(html)
          print("Custom splash applied")
          PYEOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          name: github-pages
          retention-days: 20

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
